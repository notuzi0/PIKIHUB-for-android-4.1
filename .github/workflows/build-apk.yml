name: Build PikiHub APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install both JDKs. 17 is needed for the Android SDK manager/licensing.
      # 8 is needed later to actually compile with cordova-android 7.x's old Gradle/AGP.
      # Listing 8 first, 17 last makes 17 the default JAVA_HOME/PATH for the steps in between.
      - name: Set up JDKs (8 and 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: cordova platform add android@7.1.4

      - name: Install plugins
        run: cordova plugin add cordova-plugin-whitelist

      - name: Build debug APK
        run: |
          export JAVA_HOME="$JAVA_HOME_8_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "Using JAVA_HOME=$JAVA_HOME"
          java -version

          # Prepare the Android project files (no build yet).
          cordova prepare android

          # Build directly with the project's OWN bundled Gradle wrapper, not
          # whatever "gradle" happens to be preinstalled on the runner image.
          # cordova-android 7.1.4's wrapper is an old Gradle version made for
          # JDK 8 — calling it directly avoids cordova's build step reaching
          # for the runner's system Gradle (which needs JDK 17+ and breaks
          # this old toolchain).
          cd platforms/android
          chmod +x ./gradlew
          unset GRADLE_HOME
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: find . -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PikiHub-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
